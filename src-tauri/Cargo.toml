[package]
name = "projectradar"
version = "0.1.0"
description = "Centraal overzicht van je git-projecten over meerdere PC's"
authors = ["mkb"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "projectradar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gethostname = "1"
portable-pty = "0.9.0"
axum = "0.7"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time"] }
rand = "0.8"
# Blocking client: de nachtelijke runner draait in een plain std::thread
# (net als schedule.rs/pty.rs), niet in de al draaiende axum/tokio-runtime.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
